server:
  port: 8080

bpmnflow:
  model-path: classpath:pizza-delivery.bpmn
  config-path: classpath:bpmn-config.yaml
  expose-api: true   # Enables GET /process/** inspection endpoints

spring:
  application:
    name: bpmnflow-demo
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true

springdoc:
  packages-to-scan:
    - org.bpmnflow.demo
    - org.bpmnflow.starter.api